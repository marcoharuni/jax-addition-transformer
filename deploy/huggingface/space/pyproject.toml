[project]
name = "jax-addition-transformer-space"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio>=5,<7",
  "huggingface-hub>=1,<2",
  "jax==0.8.1",
  "numpy==2.3.3",
  "safetensors==0.6.2",
]

[dependency-groups]
dev = [
  "gradio-client>=1,<3",
  "pytest==8.4.2",
  "ruff==0.14.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
