[project]
name = "jax-addition-transformer"
version = "0.1.0"
description = "A from-scratch 10,000,000-parameter arithmetic transformer in JAX and Flax NNX"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "Marco Haruni"}]
dependencies = [
  "jax==0.7.2",
  "flax==0.12.0",
  "optax==0.2.6",
  "orbax-checkpoint==0.11.28",
  "numpy==2.3.3",
  "matplotlib==3.10.7",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1", "nbformat==5.10.4", "build==1.3.0"]

[project.scripts]
jat-inspect = "jax_addition_transformer.cli:inspect_main"
jat-train = "jax_addition_transformer.cli:train_main"
jat-eval = "jax_addition_transformer.cli:eval_main"
jat-chat = "jax_addition_transformer.cli:chat_main"
jat-report = "jax_addition_transformer.cli:report_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jax_addition_transformer"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E401", "E402", "E501", "E701", "E702", "I001", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
